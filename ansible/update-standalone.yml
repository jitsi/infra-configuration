---
- name: Upgrade Standalone Jitsi Components
  hosts: all
  gather_facts: true
  become: true
  become_user: root
  vars:
    java_use_11: true
    # Seconds to wait for the standalone to have no conferences before upgrading; 0 skips the wait.
    standalone_update_idle_wait_seconds: 0
    # false stages everything on disk and leaves the running services alone.
    standalone_update_restart: true
    standalone_update_policy_rc_marker: written by update-standalone.yml, safe to delete
  vars_files:
    - config/vars.yml
    - roles/prosody/defaults/main.yml
    - roles/jitsi-meet-branding/defaults/main.yml
    - roles/jitsi-meet/defaults/main.yml
    # shard_region, which the nginx site template reads
    - roles/jitsi-meet/vars/main.yml
    - roles/jicofo/defaults/main.yml
    - roles/jitsi-videobridge/defaults/main.yml
    - secrets/ssh-users.yml
    - secrets/jibri.yml
    - secrets/jicofo.yml
    - secrets/jigasi.yml
    - secrets/coturn.yml
    - secrets/jvb.yml
    - secrets/consul.yml
    - secrets/prosody.yml
    - secrets/prosody-egress-aws.yml
    - secrets/repo.yml
    - secrets/github-deploy.yml
    - secrets/asap-keys.yml
    - secrets/ssl-certificates.yml
    - sites/{{ hcv_environment }}/vars.yml

  pre_tasks:
    - name: Wait for system to be ready
      ansible.builtin.wait_for:
        port: 22
        timeout: 60
        state: started
        search_regex: OpenSSH
      register: response
      until: response
      retries: 10
      delay: 3

    # Everything that can be checked while the host is still serving traffic is
    # checked here, before anything on the host changes.
    - name: Run pre-flight checks
      ansible.builtin.include_tasks: tasks/update-standalone-preflight.yml
      tags: "upgrade"

    # Packages, patches, keys, certificates and config go onto disk while every
    # service keeps running. The services restart afterwards, in tasks.
    - name: Stage the upgrade without restarting anything
      ansible.builtin.include_tasks: tasks/update-standalone-stage.yml

  handlers:
    - name: Remove patches # noqa ignore-errors
      ansible.builtin.shell: |
        set -o pipefail
        find /usr/lib/prosody -name "*.orig" | xargs -r rm && find /usr/lib/prosody -name ".*.lua" | xargs -r rm
      args:
        executable: /bin/bash
      ignore_errors: true

    - name: Reload prosody
      ansible.builtin.debug:
        msg: "Skipping prosody reload - the restart tasks restart prosody if it changed"

  # Runs after the pre_tasks handlers have flushed, so the prosody patch backups are
  # already cleaned up.
  tasks:
    - name: Restart only the services the upgrade changed
      ansible.builtin.include_tasks: tasks/update-standalone-restart.yml
      when: standalone_update_restart | bool
      tags: "upgrade"

  post_tasks:
    - name: Register upgraded Jicofo version
      tags: "gather_versions"
      ansible.builtin.shell: |
        set -o pipefail
        dpkg -s jicofo | grep Version | awk '{print $2}' | cut -d'-' -f2
      args:
        executable: /bin/bash
      register: jicofo_version_shell
      changed_when: jicofo_version_shell.rc != 0

    - name: Register upgraded Meet version
      tags: "gather_versions"
      ansible.builtin.shell: |
        set -o pipefail
        dpkg -s jitsi-meet-web | grep Version | awk '{print $2}' | cut -d'.' -f3 | cut -d'-' -f1
      args:
        executable: /bin/bash
      register: jitsi_meet_version_shell
      changed_when: jitsi_meet_version_shell.rc != 0

    - name: Register upgraded JVB version
      tags: "gather_versions"
      ansible.builtin.shell: |
        set -o pipefail
        dpkg -s jitsi-videobridge2 | grep Version | awk '{print $2}' | cut -d'-' -f2
      args:
        executable: /bin/bash
      register: jvb_version_shell
      changed_when: jvb_version_shell.rc != 0

    - name: Register upgraded Prosody version
      tags: "gather_versions"
      ansible.builtin.shell: |
        set -o pipefail
        dpkg -s prosody | grep Version | awk '{print $2}' | cut -d'-' -f1
      args:
        executable: /bin/bash
      register: prosody_version_shell
      changed_when: prosody_version_shell.rc != 0

    - name: Display upgrade results
      ansible.builtin.debug:
        msg: |
          Upgrade completed successfully:
          - Prosody: {{ prosody_version_shell.stdout }}
          - Jitsi Meet: {{ jitsi_meet_version_shell.stdout }}
          - Jicofo: {{ jicofo_version_shell.stdout }}
          - JVB: {{ jvb_version_shell.stdout }}
      tags: "gather_versions"
