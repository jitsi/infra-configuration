---
# Shared clone logic for the on-disk boot scripts (configure-*-local*.sh), see
# files/git-mirror-lib.sh. Roles that ship one of those scripts depend on this
# role so the library and the script always land in the same run.
- name: Create the boot library directory
  ansible.builtin.file:
    path: "{{ boot_git_mirror_path }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Install the git mirror boot library
  ansible.builtin.copy:
    src: git-mirror-lib.sh
    dest: "{{ boot_git_mirror_lib }}"
    mode: "0644"
    owner: root
    group: root
