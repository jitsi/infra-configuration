---
# Installs and configures telegraf, exposed for prometheus on :9126. The role
# keeps the wavefront name from the upstream role it was copied from; nothing
# in it talks to wavefront any more.

- name: Fail_Fast if not Ubuntu
  ansible.builtin.fail:
    msg: "We do not currently support your distribution"
  when: ansible_distribution != "Ubuntu"
  tags:
    - install
    - debian
    - check
    - failfast

- name: Install telegraf apt repository
  ansible.builtin.include_tasks: packages/Debian.yml
  when: wavefront_install_collector
  tags:
    - prereqs
    - install
    - debian

- name: Install collector (telegraf)
  ansible.builtin.include_tasks: telegraf/configure.yml
  when: wavefront_install_collector
  tags:
    - install
    - collector
    - debian

- name: Configure collector (telegraf)
  ansible.builtin.include_tasks: telegraf/configure_no_install.yml
  when: wavefront_configure_collector
  tags:
    - install
    - collector
    - debian
