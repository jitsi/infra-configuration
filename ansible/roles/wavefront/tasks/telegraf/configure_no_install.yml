---
- name: Write telegraf.conf
  ansible.builtin.template:
    src: telegraf.conf.wfcopy.j2
    dest: "{{ telegraf_main_config }}"
    mode: 0644
  notify: Restart telegraf
  tags:
    - install
    - debian
    - collector
    - configure

- name: Create Prometheus output plugin config 20-prometheus.conf
  ansible.builtin.template:
    src: 20-prometheus.conf.j2
    dest: "{{ telegraf_prometheus_output_plugin_config }}"
    mode: 0644
  notify: Restart telegraf
  tags:
    - install
    - debian
    - collector
    - configure

# Images and hosts configured before #910 still carry the wavefront output,
# which fails every flush against a proxy that no longer exists and counts
# each failure in telegraf_internal_write_errors.
- name: Remove the wavefront output plugin config 10-wavefront.conf
  ansible.builtin.file:
    path: "{{ telegraf_legacy_wavefront_output_config }}"
    state: absent
  notify: Restart telegraf
  tags:
    - install
    - debian
    - collector
    - configure

- name: Create systemd telegraf service overrides directory
  ansible.builtin.file:
    mode: 0755
    path: /etc/systemd/system/telegraf.service.d
    state: directory

- name: Set systemd telegraf service overrides
  ansible.builtin.copy:
    dest: /etc/systemd/system/telegraf.service.d/50-oomscoreadjust.conf
    mode: 0644
    owner: root
    content: |
      [Service]
      OOMScoreAdjust=1000
  register: systemd_telegraf_service_override

- name: Run systemd daemon-reload if the telegraf service override was changed # noqa no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: systemd_telegraf_service_override.changed

- name: Ensure telegraf is running
  ansible.builtin.service:
    name: telegraf
    state: started
    enabled: true
