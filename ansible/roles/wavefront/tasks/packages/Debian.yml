---
- name: Create apt keyrings directory
  ansible.builtin.file:
    path: "{{ wavefront_telegraf_keyring | dirname }}"
    state: directory
    mode: 0755
  tags:
    - prereqs
    - install
    - debian
    - collector

# The key is published ASCII-armored and apt reads that form directly, so it
# goes to disk as-is rather than through apt-key, which is deprecated and gone
# on the newer bases.
- name: Add Telegraf apt repository key
  ansible.builtin.get_url:
    url: "{{ wavefront_telegraf_repo_gpgkey }}"
    dest: "{{ wavefront_telegraf_keyring }}"
    mode: 0644
  tags:
    - prereqs
    - install
    - debian
    - collector

- name: Install Telegraf pre-requisite packages (Ubuntu)
  ansible.builtin.apt:
    name: ['apt-transport-https']
    state: present
    update_cache: true
  tags:
    - prereqs
    - install
    - debian
    - collector

- name: Add Telegraf apt repository
  ansible.builtin.apt_repository:
    repo: "{{ wavefront_telegraf_repo_line }}"
    state: present
    update_cache: true
  tags:
    - prereqs
    - install
    - debian
    - collector
