    "jitsi_jvb_ice_succeeded_relayed",
    "jitsi_jvb_incoming_bitrate",
    "jitsi_jvb_incoming_loss_fraction",
    "jitsi_jvb_incoming_packet_rate",
    "jitsi_jvb_jvm_*",
    "jitsi_jvb_keyframe_budget_wait_api_milliseconds_total",
