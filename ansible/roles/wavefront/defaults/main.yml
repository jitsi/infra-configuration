telegraf_additional_config_dir: "{{ telegraf_config_dir }}/telegraf.d"
telegraf_config_dir: "/etc/telegraf"
telegraf_hostname: "{{ ansible_fqdn }}"
# no longer rendered: only named so configure can remove it from hosts and
# images that still carry it
telegraf_legacy_wavefront_output_config: "{{ telegraf_additional_config_dir }}/10-wavefront.conf"
telegraf_main_config: "{{ telegraf_config_dir }}/telegraf.conf"
telegraf_prometheus_output_plugin_config: "{{ telegraf_additional_config_dir }}/20-prometheus.conf"
wavefront_collector: 'telegraf'
# Pinned rather than floating, and kept equal to the telegraf image tag in
# infra-provisioning nomad/telegraf.hcl so the VM and nomad populations speak one
# config dialect and emit one metric set. Do not move this to a newer release
# without rendering the config for every population and diffing the emitted
# metric names against the version in use: telegraf drops behaviour in minor
# releases with nothing that would fail a deploy. Getting here from 1.29.5 meant
# moving fieldpass/fielddrop (removed in 1.40) to fieldinclude/fieldexclude, the
# inputs.net protocol stats (removed in 1.37) to inputs.nstat, and dropping
# procstat's cmdline_tag/pid_tag (removed in 1.40).
#
# This is the version an image build installs, not the version a given host is
# running: a VM keeps the telegraf its base image was built with. The template
# reads that binary's version (tasks/telegraf/detect_version.yml) and renders
# the dialect it accepts, so moving this pin does not have to wait for the
# fleet, and a newer infra-configuration run against an older image is safe.
wavefront_collector_version: '1.40.1-1'
wavefront_configure_collector: false
wavefront_install_collector: false
# Scoped to the telegraf repo via signed-by rather than dropped in
# trusted.gpg.d, so the key cannot vouch for any other source, and removed again
# with the repo when wavefront_telegraf_remove_repo is set.
wavefront_telegraf_keyring: /etc/apt/keyrings/influxdata-telegraf.asc
wavefront_telegraf_pkg_url: 'https://repos.influxdata.com'
wavefront_telegraf_remove_repo: true
# InfluxData serves every release from one release-independent suite. Their
# per-release suites stop at jammy, so the NobleBase images have no dist of their
# own and only this one resolves for the whole fleet.
wavefront_telegraf_repo_dist: stable
wavefront_telegraf_repo_branch: "main"
wavefront_telegraf_repo_line: "deb [signed-by={{ wavefront_telegraf_keyring }}] {{ wavefront_telegraf_pkg_url }}/ubuntu/
  {{ wavefront_telegraf_repo_dist }} {{ wavefront_telegraf_repo_branch }}"
# influxdata-archive.key, not influxdata-archive_compat.key: the suites are now
# signed by subkey DA61C26A0585BD3B, which only the former carries. The compat
# key holds just D8FF8E1F7DF8B07E and leaves apt with "NO_PUBKEY".
wavefront_telegraf_repo_gpgkey: "https://repos.influxdata.com/influxdata-archive.key"
