  prosody_account_password:
    jid: "{{ jibri_brewery_username_B }}@{{ jibri_brewery_jvb_domain }}"
    account_file: "{{ jibri_brewery_jvb_path_B }}"
    password: "{{ secrets_jibri_brewery_B }}"
    config: "{{ jibri_brewery_jvb_config }}"
  when: jibri_brewery_jvb_flag | bool and secrets_jibri_brewery_B is defined and secrets_jibri_brewery_B and secrets_jibri_brewery_B != ""

- name: Update jibri account A for selenium
  prosody_account_password:
    jid: "{{ jibri_selenium_user_A }}@{{ jibri_selenium_domain }}"
    account_file: "{{ jibri_selenium_path_A }}"
    password: "{{ secrets_jibri_selenium_A }}"
  when: secrets_jibri_selenium_A is defined and secrets_jibri_selenium_A and secrets_jibri_selenium_A != ""

- name: Update jibri account B for selenium
  prosody_account_password:
    jid: "{{ jibri_selenium_user_B }}@{{ jibri_selenium_domain }}"
    account_file: "{{ jibri_selenium_path_B }}"
    password: "{{ secrets_jibri_selenium_B }}"
