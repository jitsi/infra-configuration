---
consul_apt_key: https://apt.releases.hashicorp.com/gpg
consul_apt_repo: https://apt.releases.hashicorp.com
consul_architecture: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
consul_log_dir: /var/log/
# Pinned deliberately. Consul 2.0.4 regressed server-side RPC handling: servers
# arm a read deadline on idle multiplexed streams and close the connection after
# limits.rpc_client_timeout (default 60s), while the client pool holds an idle
# connection for ~127s. The client then hands out a connection the server has
# already closed and the RPC fails with EOF. Reads are retried by the pool;
# writes (KVS.Apply, Coordinate.Update) are not, so they fail outright.
# 2.0.3 is the newest release without the regression.
# Override with CONSUL_APT_VERSION to build an image on a different release.
consul_apt_version: "{{ lookup('env','CONSUL_APT_VERSION') | default('2.0.3-1', true) }}"
