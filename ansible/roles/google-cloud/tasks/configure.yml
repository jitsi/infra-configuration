---
# jigasi reads this key directly via GOOGLE_APPLICATION_CREDENTIALS (see the
# jigasi role's config.j2); the Google Java client needs the file, not the
# gcloud CLI. No site currently selects GoogleCloudTranscriptionService -- every
# transcriber env sets jigasi_transcriber_oci_flag -- so this is here for the
# fallback case only.
- name: Google cloud config directory
  ansible.builtin.file:
    mode: 0755
    path: "{{ google_cloud_conf_dir }}"
    state: "directory"

- name: Confirm jitsi group exists
  ansible.builtin.group:
    name: jitsi
    state: present

- name: Install google cloud key file
  ansible.builtin.copy:
    dest: "{{ google_cloud_conf_dir }}/google-cloud-s2t-key-file.json"
    content: "{{ google_cloud_service_key_json }}"
    mode: 0640
    group: jitsi
