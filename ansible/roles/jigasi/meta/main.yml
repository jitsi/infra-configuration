---
galaxy_info:
  author: Aaron van Meerten
  description: configure jigasi
  license: Apache License Version 2.0
  min_ansible_version: '6.6.0'
  platforms:
    - name: Ubuntu
      releases:
        - focal
        - jammy
dependencies:
  - { role: boot-git-mirror }  # shared checkout_repos for the on-disk boot script (JIT-16092)
  - { role: jitsi-repo, when: jigasi_install_flag }
  - { role: openjdk-java, when: jigasi_install_flag }
