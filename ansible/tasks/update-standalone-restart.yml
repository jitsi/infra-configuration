---
# Restarts only what update-standalone-stage.yml changed, then checks the standalone
# is healthy again.
#
# A service restarts when any file it runs from has a ctime newer than the moment
# systemd last started it. That catches package upgrades, prosody plugins and patches
# and rewritten config alike, and it still holds when an earlier run staged files but
# failed before restarting anything. A core service that is not running is started.
#
# The prosody plugins are the exception. With a branding package they ship in it, so
# every web client upgrade rewrites them all, unchanged or not. Their contents are
# compared instead, against checksums saved once prosody runs on what is on disk.
# Until the first run saves them, the plugins count by ctime like everything else.
#
# Only regular files outside hidden directories count. /usr/share/jicofo and
# /usr/share/jitsi-videobridge are their services' home directories, and the bridge
# writes a JNA cache under .cache there while it runs.
#
# Besides prosody itself a standalone can run more prosody instances from the same
# code (prosody-jvb, the visitor prosodies prosody-v0, prosody-v1, ...). Each one
# running is found from its ExecStart and watched with its own config directory.
# jicofo and the bridge hold XMPP connections to those instances, so when any prosody
# restarts they are stopped first and started after it. nginx only reloads, which
# leaves open websockets on the old workers.

- name: Restart - find the prosody instances on this host
  ansible.builtin.shell: |
    set -o pipefail
    {
      echo prosody.service
      systemctl list-units --type=service --state=active --plain --no-legend 'prosody*.service' | awk '{print $1}'
    } | sort -u | while read -r unit; do
      exec_start="$(systemctl show --property=ExecStart --value "$unit")"
      case "$exec_start" in
        *"path=/usr/bin/prosody "*) ;;
        *) continue ;;
      esac
      config="$(echo "$exec_start" | sed -n 's/.*--config \([^ ;]*\).*/\1/p')"
      echo "$unit $(dirname "${config:-/etc/prosody/prosody.cfg.lua}")"
    done
  args:
    executable: /bin/bash
  register: restart_prosody_instances
  changed_when: false

- name: Restart - checksum the prosody plugins on disk
  ansible.builtin.shell: |
    set -o pipefail
    cd {{ prosody_plugins_path | quote }}
    find -H . -path '*/.*' -prune -o -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
  args:
    executable: /bin/bash
  register: restart_plugins_checksums
  changed_when: false

- name: Restart - read the prosody plugin checksums saved at the last restart
  ansible.builtin.slurp:
    src: "{{ standalone_update_plugins_manifest }}"
  register: restart_plugins_manifest
  failed_when: false

- name: Restart - list the prosody plugins whose contents changed
  ansible.builtin.set_fact:
    restart_plugins_changed: "{{ restart_plugins_checksums.stdout_lines
      | symmetric_difference((restart_plugins_manifest.content | b64decode).splitlines())
      | map('regex_replace', '^\\S+\\s+\\./', '') | unique | list }}"
  when: restart_plugins_manifest.content is defined

- name: Restart - list what each service watches
  ansible.builtin.set_fact:
    restart_watched: "{{ restart_prosody_watched + restart_java_watched }}"
  vars:
    restart_prosody_code: "{{ ['/usr/lib/prosody', prosody_basepath | default('/usr/lib/prosody')]
      + ([] if restart_plugins_changed is defined else [prosody_plugins_path]) }}"
    restart_prosody_watched: >-
      {%- set watched = [] -%}
      {%- for line in restart_prosody_instances.stdout_lines -%}
      {%- set _ = watched.append({'unit': line.split()[0], 'paths': (restart_prosody_code + [line.split()[1]]) | unique}) -%}
      {%- endfor -%}
      {{ watched }}
    restart_java_watched:
      - unit: jicofo.service
        paths:
          - /usr/share/jicofo
          - /etc/jitsi/jicofo
      - unit: jitsi-videobridge2.service
        paths:
          - /usr/share/jitsi-videobridge
          - /etc/jitsi/videobridge

- name: Restart - list files changed since each service last started
  ansible.builtin.shell: |
    set -o pipefail
    if [ "$(systemctl is-active {{ item.unit }})" != "active" ]; then
      echo "{{ item.unit }} is not running"
      exit 0
    fi
    since="@$(date -d "$(systemctl show --property=ActiveEnterTimestamp --value {{ item.unit }})" +%s)"
    for path in {{ item.paths | map('quote') | join(' ') }}; do
      if [ -e "$path" ]; then
        find -H "$path" -path '*/.*' -prune -o -type f -newerct "$since" -print -quit
      fi
    done
  args:
    executable: /bin/bash
  loop: "{{ restart_watched }}"
  loop_control:
    label: "{{ item.unit }}"
  register: restart_changed_files
  changed_when: false

- name: Restart - decide which services to restart
  ansible.builtin.set_fact:
    # prosody.service first, so jicofo's own XMPP server is back soonest
    standalone_update_restart_prosodies: "{{ (['prosody.service'] | intersect(restart_due))
      + (restart_due | select('match', '^prosody') | reject('equalto', 'prosody.service') | list) }}"
    standalone_update_restart_jicofo: "{{ restart_prosody_due or 'jicofo.service' in restart_due }}"
    standalone_update_restart_jvb: "{{ restart_prosody_due or 'jitsi-videobridge2.service' in restart_due }}"
  vars:
    restart_due_by_ctime: "{{ restart_changed_files.results | rejectattr('stdout_lines', 'equalto', []) | map(attribute='item.unit') | list }}"
    restart_due_by_plugins: "{{ restart_watched | map(attribute='unit') | select('match', '^prosody') | list
      if restart_plugins_changed | default([]) | length > 0 else [] }}"
    restart_due: "{{ (restart_due_by_ctime + restart_due_by_plugins) | unique }}"
    restart_prosody_due: "{{ restart_due | select('match', '^prosody') | list | length > 0 }}"

- name: Restart - report what will restart and why
  ansible.builtin.debug:
    msg: |
      prosody instances: {{ standalone_update_restart_prosodies | join(', ') if standalone_update_restart_prosodies else 'unchanged' }}
      jicofo: {{ 'restart' if standalone_update_restart_jicofo else 'unchanged' }}
      jitsi-videobridge2: {{ 'restart' if standalone_update_restart_jvb else 'unchanged' }}
      nginx: {{ 'reload' if standalone_update_nginx_certs_changed | default(false) else 'unchanged' }}
      Prosody plugins with new contents: {{ (restart_plugins_changed | join(', ') or 'none')
        if restart_plugins_changed is defined else 'no saved checksums, plugins compared by ctime' }}
      Changed since start (first match per path):
      {% for result in restart_changed_files.results %}
        {{ result.item.unit }}: {{ result.stdout_lines | join(', ') if result.stdout_lines else 'nothing' }}
      {% endfor %}

- name: Restart - stop jicofo and the bridge while prosody restarts
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop:
    - jicofo
    - jitsi-videobridge2
  when: standalone_update_restart_prosodies | length > 0

- name: Restart - restart the prosody instances
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop: "{{ standalone_update_restart_prosodies }}"

- name: Restart - wait for prosody to accept client connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 5222
    timeout: 60
  when: "'prosody.service' in standalone_update_restart_prosodies"

- name: Restart - restart jicofo
  ansible.builtin.systemd:
    name: jicofo
    state: restarted
  when: standalone_update_restart_jicofo

- name: Restart - restart the bridge
  ansible.builtin.systemd:
    name: jitsi-videobridge2
    state: restarted
  when: standalone_update_restart_jvb

- name: Restart - check the nginx config and certificates before reloading
  ansible.builtin.command: nginx -t
  changed_when: false
  when: standalone_update_nginx_certs_changed | default(false)

- name: Restart - reload nginx for the new certificates
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  when: standalone_update_nginx_certs_changed | default(false)

- name: Ensure all services are started
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - prosody
    - jicofo
    - jitsi-videobridge2
    - nginx

# Every prosody instance now runs the plugins on disk, restarted or not.
- name: Restart - create the directory for the saved plugin checksums
  ansible.builtin.file:
    path: "{{ standalone_update_plugins_manifest | dirname }}"
    state: directory
    mode: "0755"

- name: Restart - save the prosody plugin checksums for the next upgrade
  ansible.builtin.copy:
    dest: "{{ standalone_update_plugins_manifest }}"
    content: "{{ restart_plugins_checksums.stdout }}\n"
    mode: "0644"

# jicofo reports unhealthy until it has an operational bridge, so check the bridge first.
- name: Restart - wait for the bridge to report healthy
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/about/health
  register: restart_jvb_health
  until: restart_jvb_health.status == 200
  retries: 24
  delay: 5

- name: Restart - wait for jicofo to report healthy
  ansible.builtin.uri:
    url: http://127.0.0.1:8888/about/health
  register: restart_jicofo_health
  until: restart_jicofo_health.status == 200
  retries: 24
  delay: 5
