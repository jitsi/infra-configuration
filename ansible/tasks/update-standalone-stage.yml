---
# Puts every package, prosody plugin, patch, key, certificate and config file the
# upgrade needs on disk while nginx, the prosody instances, jicofo and the bridge keep
# serving on the versions they have in memory. update-standalone-restart.yml then
# bounces only what changed. Three things would otherwise restart services mid-stage:
#
# - the maintainer scripts: jvb and jicofo restart after upgrade and prosody restarts
#   from its postinst. A policy-rc.d that refuses every action is in place throughout.
# - needrestart's apt hook, which restarts any daemon whose files were replaced, with
#   systemctl directly. NEEDRESTART_SUSPEND turns the hook off for every task here.
# - the jitsi-videobridge2 postinst, which runs `systemctl stop` itself, so neither of
#   the above can hold it. The bridge is therefore installed last, just before the
#   restart tasks start it again.
#
# If anything in here fails, the services that were running still are, apart from the
# bridge if its install had begun, but on-disk files may be a mix of old and new.
# Re-run the upgrade rather than restarting services by hand.

- name: Stage the upgrade with service restarts blocked
  environment:
    NEEDRESTART_SUSPEND: "1"
  block:
    - name: Stage - block service restarts from package maintainer scripts
      ansible.builtin.copy:
        dest: /usr/sbin/policy-rc.d
        mode: "0755"
        content: |
          #!/bin/sh
          # {{ standalone_update_policy_rc_marker }}
          # Exit 101 tells invoke-rc.d and deb-systemd-invoke the action is forbidden,
          # so package upgrades leave running services alone.
          exit 101

    - name: Install SSL certificate
      ansible.builtin.copy:
        mode: "0644"
        content: "{{ jitsi_meet_ssl_certificate }}"
        dest: "{{ jitsi_meet_ssl_dest_dir }}/{{ jitsi_meet_domain_name }}.crt"
      register: stage_ssl_certificate

    - name: Install SSL private key
      ansible.builtin.copy:
        content: "{{ jitsi_meet_ssl_key_name }}"
        dest: "{{ jitsi_meet_ssl_dest_dir }}/{{ jitsi_meet_domain_name }}.key"
        mode: "0600"
      register: stage_ssl_key

    - name: Install Signal API SSL certificate
      ansible.builtin.copy:
        mode: "0644"
        content: "{{ jitsi_meet_signal_api_ssl_certificate }}"
        dest: "{{ jitsi_meet_ssl_dest_dir }}/{{ jitsi_meet_signal_api_server_name }}.crt"
      register: stage_signal_api_ssl_certificate

    - name: Install Signal API SSL private key
      ansible.builtin.copy:
        content: "{{ jitsi_meet_signal_api_ssl_key_name }}"
        dest: "{{ jitsi_meet_ssl_dest_dir }}/{{ jitsi_meet_signal_api_server_name }}.key"
        mode: "0600"
      register: stage_signal_api_ssl_key

    - name: Stage - note whether nginx needs to pick up new certificates
      ansible.builtin.set_fact:
        standalone_update_nginx_certs_changed: "{{ [stage_ssl_certificate, stage_ssl_key,
          stage_signal_api_ssl_certificate, stage_signal_api_ssl_key] | selectattr('changed') | list | length > 0 }}"

    # now install prosody, either from URL or via apt
    - name: Include apt install tasks
      ansible.builtin.include_tasks: roles/prosody/tasks/install-from-apt.yml
      when: prosody_install_from_apt

    - name: Include URL install tasks
      ansible.builtin.include_tasks: roles/prosody/tasks/install-from-url.yml
      when: not prosody_install_from_apt

    # apply prosody patches
    - name: Include prosody patches tasks
      ansible.builtin.include_tasks: roles/prosody/tasks/patches.yml

    # after the prosody install: its postinst resets /etc/prosody/certs to 0640, and
    # flipping the keys back to 0644 on the next run would look like a reason to
    # restart prosody
    - name: Install ASAP key
      ansible.builtin.copy:
        dest: "{{ prosody_asap_key_path }}"
        mode: "0644"
        content: "{{ asap_key['key'] }}"

    - name: Install ASAP shortlived key
      ansible.builtin.copy:
        dest: "{{ prosody_asap_shortlived_key_path }}"
        mode: "0644"
        content: "{{ prosody_asap_shortlived_key['key'] }}"
      when: prosody_enable_shortlived_tokens

    # now update the prosody plugins, when they come from jitsi-meet-prosody (see the
    # preflight). rsync -r --checksum (no -a) rewrites only plugins whose contents
    # changed, so an unchanged set is no reason to restart prosody. Like
    # roles/jitsi-meet-prosody it copies over the top: a plugin dropped from the
    # package stays on disk.
    - name: Stage - update the prosody plugins from jitsi-meet-prosody
      when: standalone_update_plugins_from_jitsi_meet_prosody
      block:
        - name: Stage - unpack the jitsi-meet-prosody package
          ansible.builtin.shell: dpkg -x {{ jitsi_meet_prosody_deb_pkg_name }}_*.deb unpacked
          args:
            chdir: "{{ preflight_prosody_plugins_dir.path }}"
          changed_when: false

        - name: Stage - update the prosody plugins whose contents changed # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - rsync
              - --recursive
              - --checksum
              - --itemize-changes
              - "{{ preflight_prosody_plugins_dir.path }}/unpacked/usr/share/jitsi-meet/prosody-plugins/"
              - "{{ prosody_plugins_path }}/"
          register: stage_prosody_plugins_rsync
          changed_when: stage_prosody_plugins_rsync.stdout | length > 0

        - name: Stage - install the asap and external events libs
          ansible.builtin.copy:
            src: "roles/jitsi-meet-prosody/files/{{ item }}"
            dest: "{{ prosody_plugins_path }}/"
            mode: "0644"
          loop:
            - ext_events.lib.lua
            - asap.lib.lua

        - name: Stage - check whether the stanza_router patch shipped with the plugins
          ansible.builtin.stat:
            path: "{{ prosody_plugins_path }}/stanza_router_no-log.patch"
          register: stage_stanza_router_patch

        - name: Stage - apply the stanza_router_no-log patch on prosody 0.12
          ansible.posix.patch:
            basedir: "{{ '/usr/share/lua/5.1/prosody/' if ansible_distribution_major_version | int < 24 else '/usr/lib/prosody/' }}"
            src: "{{ prosody_plugins_path }}/stanza_router_no-log.patch"
            strip: 1
            remote_src: true
          when:
            - (prosody_minor_version | int) == 12
            - stage_stanza_router_patch.stat.exists

    # now install jicofo
    - name: Mark unhold on jicofo package version # noqa no-changed-when
      ansible.builtin.command: apt-mark unhold {{ jicofo_deb_pkg_name }}

    - name: Update jicofo
      ansible.builtin.apt:
        name: "{{ jicofo_deb_pkg_name }}={{ jicofo_deb_pkg_version }}"
        state: present

    - name: Mark hold on jicofo package version # noqa no-changed-when
      ansible.builtin.command: apt-mark hold {{ jicofo_deb_pkg_name }}

    # now install jitsi-meet
    - name: Mark unhold on jitsi-meet package version # noqa no-changed-when
      ansible.builtin.command: apt-mark unhold {{ jitsi_meet_deb_pkg_name }}

    - name: Install jitsi-meet
      ansible.builtin.apt:
        name: "{{ jitsi_meet_deb_pkg_name }}={{ jitsi_meet_deb_pkg_version }}"
        state: present

    - name: Mark hold on jitsi-meet package version # noqa no-changed-when
      ansible.builtin.command: apt-mark hold {{ jitsi_meet_deb_pkg_name }}

    # now reconfigure jitsi-videobridge
    - name: Install jitsi-videobridge new config file
      ansible.builtin.template:
        mode: 0644
        src: roles/jitsi-videobridge/templates/jvb.conf.j2
        dest: /etc/jitsi/videobridge/jvb.conf
      when: jvb_configure_from_template_flag

    # now reconfigure prosody
    - name: Check whether module muc_meeting_id exists
      ansible.builtin.stat:
        path: "{{ prosody_plugins_path }}/mod_muc_meeting_id.lua"
      register: muc_meeting_id_exists

    - name: Build prosody.cfg.lua from template
      ansible.builtin.template:
        src: roles/prosody/templates/prosody.cfg.lua.j2
        dest: /etc/prosody/prosody.cfg.lua
        mode: 0644

    # now reconfigure jitsi-meet branding
    - name: Register installed Meet version
      ansible.builtin.shell: |
        set -o pipefail
        dpkg -s jitsi-meet-web | grep Version | awk '{print $2}' | cut -d'.' -f3 | cut -d'-' -f1
      args:
        executable: /bin/bash
      register: jitsi_meet_web_version_shell

    - name: Install branding override when required
      ansible.builtin.apt:
        name: "{{ jitsi_meet_branding_override }}=1.0.{{ jitsi_meet_web_version_shell.stdout }}*"
        allow-downgrades: true
      environment:
        DEBIAN_FRONTEND: noninteractive
      when: jitsi_meet_branding_override != "jitsi-meet"

    # after the branding install, which could bring them back
    - name: Stage - remove the plugins prosody itself provides
      ansible.builtin.file:
        path: "{{ prosody_plugins_path }}/{{ item }}"
        state: absent
      loop:
        - mod_smacks.lua
        - mod_external_services.lua

    - name: Register installed branding version
      ansible.builtin.shell: |
        set -o pipefail
        dpkg -s {{ jitsi_meet_branding_override }} | grep Version | awk '{print $2}' | cut -d'.' -f3,4 | cut -d'-' -f1
      args:
        executable: /bin/bash
      register: jitsi_meet_branding_version_shell
      when: jitsi_meet_branding_override != "jitsi-meet"

    - name: Set jitsi_meet_branding_version
      ansible.builtin.set_fact:
        jitsi_meet_branding_version: "{{ jitsi_meet_branding_version_shell.stdout if (jitsi_meet_branding_override != 'jitsi-meet')
          else jitsi_meet_web_version_shell.stdout }}"

    # now reconfigure jitsi-meet
    - name: Deploy config file
      ansible.builtin.template:
        src: roles/jitsi-meet/templates/config.js.j2
        dest: "{{ jitsi_meet_config_path }}/{{ jitsi_meet_domain_name }}-config.js"
        mode: 0644
        owner: "www-data"

    - name: Set base HTML contents (no sanitize hack)
      ansible.builtin.set_fact:
        jitsi_meet_base_html_content: "<base href=\"{{ jitsi_meet_cdn_base_url }}/{{ jitsi_meet_cdn_prefix }}{{ jitsi_meet_branding_version }}/\" />"

    - name: Add CDN base href for meet index.html
      ansible.builtin.copy:
        content: "{{ jitsi_meet_base_html_content }}"
        dest: "{{ jitsi_meet_nginx_root }}/base.html"
        mode: 0644
        owner: "www-data"
      when: jitsi_meet_cdn_enabled

    - name: Remove CDN base href for meet index.html
      ansible.builtin.copy:
        content: ""
        dest: "{{ jitsi_meet_nginx_root }}/base.html"
        mode: 0644
        owner: "www-data"
      when: not jitsi_meet_cdn_enabled

    # now reconfigure jicofo
    - name: Jicofo configuration file
      ansible.builtin.template:
        src: roles/jicofo/templates/jicofo.conf.j2
        dest: /etc/jitsi/jicofo/jicofo.conf
        mode: 0600
        owner: jicofo
        group: jitsi

    # now install jitsi-videobridge, last: its postinst stops the bridge whatever
    # policy-rc.d says, and the restart tasks that start it again come next
    - name: Mark unhold on jitsi-videobridge package version # noqa no-changed-when
      ansible.builtin.command: apt-mark unhold jitsi-videobridge2

    - name: Update jitsi-videobridge
      ansible.builtin.apt:
        name: "jitsi-videobridge2={{ jitsi_videobridge_deb_pkg_version }}"
        state: present

    - name: Mark hold on jitsi-videobridge package version # noqa no-changed-when
      ansible.builtin.command: apt-mark hold jitsi-videobridge2

  always:
    - name: Stage - allow service restarts again
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent

    - name: Stage - remove the jitsi-meet-prosody download
      ansible.builtin.file:
        path: "{{ preflight_prosody_plugins_dir.path }}"
        state: absent
      when: preflight_prosody_plugins_dir.path is defined
